<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Entrep Fair Group 1 - Coffee Shop</title>
    
    <!-- PyScript Releases -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-pink: #faebeb;
            --dot-color: #533e43;
            --card-bg: #fffbfb;
            --accent-pink: #e8aebb;
            --dark-brown: #4a3439;
            --border-color: #ebd7da;
            --light-pink: #fdf2f4;
            --shadow: 0 12px 30px rgba(74, 52, 57, 0.12);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-pink);
            background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
            background-size: 24px 24px;
            color: var(--dark-brown);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .cafe-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: var(--shadow);
            border: 3px solid #ffffff;
        }

        .header-badge {
            background-color: var(--light-pink);
            color: var(--dark-brown);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
            margin-bottom: 10px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--dark-brown);
        }

        .menu-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.15rem;
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 6px;
        }

        .menu-item {
            background-color: var(--light-pink);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            background-color: #f7e4e7;
            border-color: var(--accent-pink);
        }

        .checkbox-custom {
            width: 18px;
            height: 18px;
            accent-color: var(--dot-color);
            cursor: pointer;
        }

        .btn-order {
            background-color: var(--dot-color);
            color: var(--bg-pink);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 14px rgba(83, 62, 67, 0.25);
            transition: all 0.2s ease;
        }

        .btn-order:hover {
            background-color: #3d2d31;
            color: #ffffff;
        }

        .receipt-container {
            display: none;
            background-color: #ffffff;
            border: 2px dashed var(--accent-pink);
            border-radius: 20px;
            padding: 20px;
        }

        .receipt-header {
            border-bottom: 1px dashed var(--border-color);
        }

        .receipt-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
        }

        .receipt-row {
            font-size: 0.9rem;
            color: #6b5257;
        }

        .receipt-row.total {
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--dark-brown);
        }
    </style>
</head>
<body>

<div class="cafe-card">
    <div class="header text-center mb-4">
        <span class="header-badge">OBMC Entrep Fair Group 1</span>
        <h1><i class="fa-solid fa-mug-saucer"></i> Coffee Shop</h1>
    </div>

    <div class="menu-title mb-3">
        <i class="fa-solid fa-list"></i> Menu
    </div>

    <form id="orderForm">
        <div class="d-flex flex-column gap-2 mb-4">
            <label class="menu-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-mug-hot"></i>
                    <span class="fw-semibold">Americano</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">₱120</span>
                    <input type="checkbox" class="checkbox-custom menu-checkbox" name="item" value="120" data-name="Americano">
                </div>
            </label>

            <label class="menu-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-whiskey-glass"></i>
                    <span class="fw-semibold">Spanish Latte</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">₱150</span>
                    <input type="checkbox" class="checkbox-custom menu-checkbox" name="item" value="150" data-name="Spanish Latte">
                </div>
            </label>

            <label class="menu-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-cube"></i>
                    <span class="fw-semibold">Cold Brew Milk</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">₱140</span>
                    <input type="checkbox" class="checkbox-custom menu-checkbox" name="item" value="140" data-name="Cold Brew Milk">
                </div>
            </label>

            <label class="menu-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-ice-cream"></i>
                    <span class="fw-semibold">Affogato</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">₱160</span>
                    <input type="checkbox" class="checkbox-custom menu-checkbox" name="item" value="160" data-name="Affogato">
                </div>
            </label>

            <label class="menu-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fw-semibold">Caramel Macchiato</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">₱155</span>
                    <input type="checkbox" class="checkbox-custom menu-checkbox" name="item" value="155" data-name="Caramel Macchiato">
                </div>
            </label>
        </div>

        <button type="button" class="btn btn-order w-100" py-click="generate_receipt">
            <i class="fa-solid fa-receipt me-1"></i> Create Order
        </button>
        <p class="text-danger text-center small mt-2 fw-semibold" id="emptyNotice" style="display: none;">Please select at least one item!</p>
    </form>

    <div class="receipt-container mt-4" id="receipt">
        <div class="receipt-header text-center pb-2 mb-3">
            <h2 class="m-0">--- RECEIPT ---</h2>
            <p class="small text-muted m-0 mt-1">Thank you for your order!</p>
        </div>

        <div id="receiptItems"></div>

        <div class="receipt-row d-flex justify-content-between mt-3">
            <span>Subtotal:</span>
            <span id="subtotal">₱0.00</span>
        </div>
        <div class="receipt-row d-flex justify-content-between">
            <span>VAT (12%):</span>
            <span id="vat">₱0.00</span>
        </div>
        <div class="receipt-row total d-flex justify-content-between mt-2">
            <span>Total Amount:</span>
            <span id="total">₱0.00</span>
        </div>

        <div class="text-center small text-muted fst-italic mt-3">
            Have a sweet day! ☕✨
        </div>
    </div>
</div>

<!-- Linking external Python file via PyScript -->
<script type="py" src="./main.py" config='{"packages": []}'></script>

</body>
</html>
